<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVexa Admin | Management Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #102d4e;
      --deep-navy: #081b35;
      --gold: #d9a62c;
      --white: #ffffff;
      --bg: #f4f7fa;
      --text: #334155;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    
    /* LOGIN SCREEN */
    #loginScreen {
      display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--deep-navy);
    }
    .login-card {
      background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .login-card img { width: 80px; margin-bottom: 20px; border-radius: 8px; }
    .login-card h2 { margin-bottom: 30px; color: var(--navy); }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; }
    .btn-login { 
      width: 100%; padding: 12px; background: var(--gold); border: none; color: var(--deep-navy); 
      font-weight: 700; border-radius: 6px; cursor: pointer; margin-top: 10px;
    }
    #loginError { color: #e11d48; margin-top: 15px; font-size: 14px; display: none; }

    /* DASHBOARD LAYOUT */
    #adminPanel { display: none; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--navy); color: white; position: fixed; height: 100%; padding: 20px; }
    .sidebar h2 { color: var(--gold); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
    .nav-links { list-style: none; padding: 0; margin-top: 30px; }
    .nav-links li { padding: 12px 15px; cursor: pointer; border-radius: 6px; margin-bottom: 5px; transition: 0.3s; }
    .nav-links li:hover, .nav-links li.active { background: rgba(255,255,255,0.1); color: var(--gold); }
    .logout-btn { margin-top: 50px; color: #fda4af; cursor: pointer; padding: 10px 15px; font-weight: 600; }
    
    .main-content { margin-left: 260px; padding: 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .header h1 { margin: 0; font-size: 24px; color: var(--navy); }
    .btn-add { background: var(--navy); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }

    /* TABLES */
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; text-align: left; padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
    td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .actions { display: flex; gap: 10px; }
    .btn-edit { color: var(--navy); cursor: pointer; font-weight: 600; background: none; border: none; }
    .btn-delete { color: #e11d48; cursor: pointer; font-weight: 600; background: none; border: none; }

    /* MODAL */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .modal-actions { margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; }
    .btn-save { background: var(--gold); color: var(--deep-navy); padding: 10px 20px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn-cancel { background: #e2e8f0; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginScreen">
    <div class="login-card">
      <img src="../eduvexa%20logo%20jpg.jpg" alt="Logo">
      <h2>Admin Login</h2>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="admin@eduvexa.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button class="btn-login" onclick="handleLogin()">Secure Login →</button>
      <div id="loginError">Invalid credentials or access denied.</div>
    </div>
  </div>

  <!-- ADMIN PANEL SECTION -->
  <div id="adminPanel">
    <div class="sidebar">
      <h2>EduVexa Admin</h2>
      <ul class="nav-links">
        <li onclick="switchTab('dashboard')" id="tab-dashboard">Dashboard</li>
        <li onclick="switchTab('countries')" id="tab-countries">Countries</li>
        <li onclick="switchTab('universities')" id="tab-universities">Universities</li>
        <li onclick="switchTab('programs')" id="tab-programs">Programs</li>
        <li onclick="switchTab('scholarships')" id="tab-scholarships">Scholarships</li>
      </ul>
      <div class="logout-btn" onclick="handleLogout()">← Logout</div>
    </div>

    <div class="main-content">
      <div class="header">
        <h1 id="pageTitle">Dashboard</h1>
        <button class="btn-add" id="addBtn" style="display:none;" onclick="openModal()">+ Add New</button>
      </div>

      <div id="contentArea" class="card">
        <div style="padding: 20px;">Welcome to EduVexa Management Portal. Select a section from the sidebar.</div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="dataModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Edit Information</h2>
        <button onclick="closeModal()" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
      </div>
      <form id="dataForm">
        <div id="formFields"></div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-save">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // FIXED SUPABASE CONFIGURATION
    const SUPABASE_URL = "https://cnxtddpqjzawfwakmlxl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LaWoUeSZI1uDSh9phxyROQ_Pm-CsgNF";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentTab = 'dashboard';
    let editId = null;
    let countriesData = [];

    // AUTH FUNCTIONS
    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        
        // Check if user is super_admin
        const { data: adminData } = await _supabase.from('admin_users').select('role').eq('user_id', data.user.id).single();
        if (!adminData || adminData.role !== 'super_admin') {
          await _supabase.auth.signOut();
          throw new Error("Unauthorized access.");
        }

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadCountries(); // Load initial data
      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.style.display = 'block';
      }
    }

    async function handleLogout() {
      await _supabase.auth.signOut();
      window.location.reload();
    }

    // UI FUNCTIONS
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('pageTitle').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
      document.getElementById('addBtn').style.display = tab === 'dashboard' ? 'none' : 'block';
      renderContent();
    }

    async function loadCountries() {
      const { data } = await _supabase.from('countries').select('*').order('id');
      countriesData = data || [];
    }

    async function renderContent() {
      const container = document.getElementById('contentArea');
      container.innerHTML = '<div style="padding:20px;">Loading...</div>';

      if (currentTab === 'dashboard') {
        container.innerHTML = '<div style="padding:20px;">Hello Admin! Select a category to manage EduVexa data.</div>';
        return;
      }

      const { data, error } = await _supabase.from(currentTab).select('*').order('id');
      if (error) {
        container.innerHTML = `<div style="padding:20px; color:red;">Error: ${error.message}</div>`;
        return;
      }

      let html = '<table><thead><tr>';
      if (currentTab === 'countries') html += '<th>ID</th><th>Name</th><th>Code</th>';
      if (currentTab === 'universities') html += '<th>Name</th><th>City</th><th>Published</th>';
      if (currentTab === 'programs') html += '<th>Name</th><th>Level</th><th>Fee</th>';
      if (currentTab === 'scholarships') html += '<th>Name</th><th>Coverage</th><th>Status</th>';
      html += '<th>Actions</th></tr></thead><tbody>';

      data.forEach(item => {
        html += '<tr>';
        if (currentTab === 'countries') html += `<td>${item.id}</td><td>${item.name}</td><td>${item.code}</td>`;
        if (currentTab === 'universities') html += `<td>${item.name}</td><td>${item.city}</td><td>${item.is_published ? '✅' : '❌'}</td>`;
        if (currentTab === 'programs') html += `<td>${item.name}</td><td>${item.degree_level}</td><td>${item.tuition_fee}</td>`;
        if (currentTab === 'scholarships') html += `<td>${item.name}</td><td>${item.coverage}</td><td>${item.status}</td>`;
        html += `<td class="actions">
          <button class="btn-edit" onclick="openModal(${item.id})">Edit</button>
          <button class="btn-delete" onclick="handleDelete(${item.id})">Delete</button>
        </td></tr>`;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // CRUD FUNCTIONS
    async function openModal(id = null) {
      editId = id;
      const formFields = document.getElementById('formFields');
      formFields.innerHTML = 'Loading fields...';
      document.getElementById('dataModal').style.display = 'flex';
      
      let item = {};
      if (id) {
        const { data } = await _supabase.from(currentTab).select('*').eq('id', id).single();
        item = data;
      }

      let fieldsHtml = '<div class="grid-2">';
      
      if (currentTab === 'countries') {
        fieldsHtml += generateInput('Name', 'name', item.name, true);
        fieldsHtml += generateInput('Code (e.g. MY)', 'code', item.code, true);
      } else if (currentTab === 'universities') {
        fieldsHtml += generateSelect('Country', 'country_id', countriesData, item.country_id);
        fieldsHtml += generateInput('University Name', 'name', item.name, true);
        fieldsHtml += generateInput('City', 'city', item.city);
        fieldsHtml += generateInput('Type', 'university_type', item.university_type);
        fieldsHtml += generateInput('Official Website', 'official_website', item.official_website);
        fieldsHtml += `</div><div style="margin-top:15px;">` + generateTextarea('Description', 'description', item.description) + `</div>`;
        fieldsHtml += `<div style="margin-top:10px;"><label><input type="checkbox" name="is_published" ${item.is_published ? 'checked' : ''}> Published</label></div>`;
      } else if (currentTab === 'programs') {
        // ... (Program fields simplified for brevity)
        fieldsHtml += generateInput('Program Name', 'name', item.name, true);
        fieldsHtml += generateInput('Degree Level', 'degree_level', item.degree_level);
      } else if (currentTab === 'scholarships') {
        fieldsHtml += generateInput('Scholarship Name', 'name', item.name, true);
        fieldsHtml += generateInput('Coverage', 'coverage', item.coverage);
      }

      fieldsHtml += '</div>';
      formFields.innerHTML = fieldsHtml;
    }

    function generateInput(label, name, value = '', req = false) {
      return `<div class="form-group"><label>${label}</label><input type="text" name="${name}" value="${value || ''}" ${req ? 'required' : ''}></div>`;
    }

    function generateSelect(label, name, options, selected) {
      let html = `<div class="form-group"><label>${label}</label><select name="${name}" style="width:100%; padding:12px; border:1px solid var(--border); border-radius:6px;">`;
      options.forEach(opt => html += `<option value="${opt.id}" ${opt.id == selected ? 'selected' : ''}>${opt.name}</option>`);
      return html + `</select></div>`;
    }

    function generateTextarea(label, name, value = '') {
      return `<div class="form-group"><label>${label}</label><textarea name="${name}" rows="4" style="width:100%; padding:12px; border:1px solid var(--border); border-radius:6px;">${value || ''}</textarea></div>`;
    }

    function closeModal() { document.getElementById('dataModal').style.display = 'none'; }

    document.getElementById('dataForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const payload = {};
      formData.forEach((value, key) => {
        if (key === 'is_published') payload[key] = true;
        else payload[key] = value;
      });
      if (currentTab === 'universities' && !payload.is_published) payload.is_published = false;

      let result;
      if (editId) result = await _supabase.from(currentTab).update(payload).eq('id', editId);
      else result = await _supabase.from(currentTab).insert(payload);

      if (result.error) alert("Error: " + result.error.message);
      else { closeModal(); renderContent(); }
    };

    async function handleDelete(id) {
      if (confirm("Are you sure you want to delete this item?")) {
        const { error } = await _supabase.from(currentTab).delete().eq('id', id);
        if (error) alert(error.message);
        else renderContent();
      }
    }
  </script>
</body>
</html>
