<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVexa Admin | Studyportals Management</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --navy: #102d4e; --deep-navy: #081b35; --gold: #d9a62c; --white: #ffffff; --bg: #f4f7fa; --text: #334155; --border: #e2e8f0; }
    * { box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    
    /* LOGIN */
    #loginScreen { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--deep-navy); }
    .login-card { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
    .login-card img { width: 70px; margin-bottom: 20px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
    .btn-gold { width: 100%; padding: 12px; background: var(--gold); border: none; color: var(--deep-navy); font-weight: 700; border-radius: 6px; cursor: pointer; }

    /* LAYOUT */
    #adminPanel { display: none; min-height: 100vh; }
    .sidebar { width: 250px; background: var(--navy); color: white; position: fixed; height: 100%; padding: 25px; }
    .nav-links { list-style: none; padding: 0; margin-top: 30px; }
    .nav-links li { padding: 12px 15px; cursor: pointer; border-radius: 8px; margin-bottom: 8px; transition: 0.3s; font-weight: 500; }
    .nav-links li:hover, .nav-links li.active { background: var(--gold); color: var(--deep-navy); }
    
    .main-content { margin-left: 250px; padding: 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .btn-add { background: var(--deep-navy); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }

    /* TABLE */
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; text-align: left; padding: 15px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .btn-edit { color: var(--navy); font-weight: 700; cursor: pointer; background: none; border: none; margin-right: 10px; }
    .btn-delete { color: #e11d48; font-weight: 700; cursor: pointer; background: none; border: none; }

    /* MODAL */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 2000; }
    .modal-content { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .modal-footer { margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-card">
      <img src="../eduvexa%20logo%20jpg.jpg" alt="Logo">
      <h2>Admin Login</h2>
      <div class="form-group"><label>Email</label><input type="email" id="email" value="eduvexastudya@gmail.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="password"></div>
      <button class="btn-gold" onclick="handleLogin()">Login to Dashboard</button>
      <p id="loginError" style="color:red; display:none; margin-top:10px; font-size:13px;"></p>
    </div>
  </div>

  <div id="adminPanel">
    <div class="sidebar">
      <h3>EduVexa Admin</h3>
      <ul class="nav-links">
        <li onclick="switchTab('dashboard')" id="tab-dashboard">Dashboard</li>
        <li onclick="switchTab('countries')" id="tab-countries">Countries</li>
        <li onclick="switchTab('universities')" id="tab-universities">Universities</li>
        <li onclick="switchTab('programs')" id="tab-programs">Programs (Studyportals)</li>
        <li onclick="switchTab('scholarships')" id="tab-scholarships">Scholarships</li>
      </ul>
      <div style="margin-top:40px; cursor:pointer; font-weight:bold; color:#fda4af;" onclick="location.reload()">← Logout</div>
    </div>

    <div class="main-content">
      <div class="header">
        <h1 id="pageTitle">Dashboard</h1>
        <button class="btn-add" id="addBtn" style="display:none;" onclick="openModal()">+ Add New</button>
      </div>
      <div id="contentArea" class="card"></div>
    </div>
  </div>

  <div id="dataModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-bottom:20px;">Edit Information</h2>
      <form id="dataForm">
        <div id="formFields"></div>
        <div class="modal-footer">
          <button type="button" onclick="closeModal()" style="padding:10px 20px; border:none; border-radius:6px; cursor:pointer;">Cancel</button>
          <button type="submit" class="btn-gold" style="width:auto;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cnxtddpqjzawfwakmlxl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LaWoUeSZI1uDSh9phxyROQ_Pm-CsgNF";
    const _db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentTab = 'dashboard';
    let editId = null;
    let countriesData = [];
    let universitiesData = [];

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await _db.auth.signInWithPassword({ email, password });
      if (error) { document.getElementById('loginError').innerText = error.message; document.getElementById('loginError').style.display='block'; return; }
      
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadBaseData();
      switchTab('dashboard');
    }

    async function loadBaseData() {
      const { data: c } = await _db.from('countries').select('*').order('name');
      const { data: u } = await _db.from('universities').select('*').order('name');
      countriesData = c || [];
      universitiesData = u || [];
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('pageTitle').innerText = tab.charAt(0).toUpperCase() + tab.slice(1);
      document.getElementById('addBtn').style.display = tab === 'dashboard' ? 'none' : 'block';
      renderContent();
    }

    async function renderContent() {
      const container = document.getElementById('contentArea');
      container.innerHTML = '<div style="padding:20px;">Loading data...</div>';
      if(currentTab === 'dashboard') { container.innerHTML = '<div style="padding:30px;"><h3>Welcome Admin!</h3><p>Manage your Global Study Directory from here.</p></div>'; return; }

      const { data } = await _db.from(currentTab).select('*').order('id', { ascending: false });
      
      let html = '<table><thead><tr>';
      if (currentTab === 'countries') html += '<th>Name</th><th>Code</th>';
      if (currentTab === 'universities') html += '<th>University Name</th><th>City</th>';
      if (currentTab === 'programs') html += '<th>Program Name</th><th>Degree</th><th>Fee</th>';
      if (currentTab === 'scholarships') html += '<th>Scholarship</th><th>Provider</th>';
      html += '<th>Actions</th></tr></thead><tbody>';

      data.forEach(item => {
        html += '<tr>';
        if (currentTab === 'countries') html += `<td>${item.name}</td><td>${item.code}</td>`;
        if (currentTab === 'universities') html += `<td>${item.name}</td><td>${item.city}</td>`;
        if (currentTab === 'programs') html += `<td>${item.name}</td><td>${item.degree_level}</td><td>${item.tuition_fee}</td>`;
        if (currentTab === 'scholarships') html += `<td>${item.name}</td><td>${item.provider}</td>`;
        html += `<td><button class="btn-edit" onclick="openModal(${item.id})">Edit</button><button class="btn-delete" onclick="handleDelete(${item.id})">Delete</button></td></tr>`;
      });
      container.innerHTML = html + '</tbody></table>';
    }

    async function openModal(id = null) {
      editId = id;
      const formFields = document.getElementById('formFields');
      formFields.innerHTML = 'Loading fields...';
      document.getElementById('dataModal').style.display = 'flex';
      
      let item = {};
      if (id) {
        const { data } = await _db.from(currentTab).select('*').eq('id', id).single();
        item = data;
      }

      let html = '<div class="grid-2">';
      if (currentTab === 'countries') {
        html += genInp('Name', 'name', item.name); html += genInp('Code', 'code', item.code);
      } else if (currentTab === 'universities') {
        html += genSel('Country', 'country_id', countriesData, item.country_id);
        html += genInp('University Name', 'name', item.name);
        html += genInp('City', 'city', item.city);
        html += genInp('Website', 'official_website', item.official_website);
      } else if (currentTab === 'programs') {
        html += genSel('University', 'university_id', universitiesData, item.university_id);
        html += genInp('Program Name', 'name', item.name);
        html += genInp('Degree Level', 'degree_level', item.degree_level);
        html += genInp('Duration (e.g. 3 Years)', 'duration', item.duration);
        html += genInp('Tuition Fee', 'tuition_fee', item.tuition_fee);
        html += genInp('Official Link', 'official_program_url', item.official_program_url);
        html += `</div><div style="margin-top:15px;">` + genTxt('Admission Requirements', 'admission_requirements', item.admission_requirements) + `</div><div class="grid-2">`;
      } else if (currentTab === 'scholarships') {
        html += genSel('Country', 'country_id', countriesData, item.country_id);
        html += genInp('Scholarship Name', 'name', item.name);
        html += genInp('Provider', 'provider', item.provider);
        html += genInp('Coverage', 'coverage', item.coverage);
        html += genInp('Deadline', 'application_deadline', item.application_deadline);
      }
      
      html += `</div><div style="margin-top:15px;"><label><input type="checkbox" name="is_published" ${item.is_published !== false ? 'checked' : ''}> Published on Website</label></div>`;
      formFields.innerHTML = html;
    }

    function genInp(l, n, v) { return `<div class="form-group"><label>${l}</label><input type="text" name="${n}" value="${v || ''}"></div>`; }
    function genTxt(l, n, v) { return `<div class="form-group"><label>${l}</label><textarea name="${n}" rows="3">${v || ''}</textarea></div>`; }
    function genSel(l, n, opts, sel) {
      let h = `<div class="form-group"><label>${l}</label><select name="${n}">`;
      opts.forEach(o => h += `<option value="${o.id}" ${o.id == sel ? 'selected' : ''}>${o.name}</option>`);
      return h + `</select></div>`;
    }

    function closeModal() { document.getElementById('dataModal').style.display = 'none'; }

    document.getElementById('dataForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {};
      fd.forEach((v, k) => { if(k === 'is_published') payload[k] = true; else payload[k] = v; });
      if(!payload.is_published) payload.is_published = false;

      let res;
      if (editId) res = await _db.from(currentTab).update(payload).eq('id', editId);
      else res = await _db.from(currentTab).insert(payload);

      if (res.error) alert(res.error.message); else { closeModal(); renderContent(); }
    };

    async function handleDelete(id) {
      if (confirm("Delete this item?")) {
        await _db.from(currentTab).delete().eq('id', id);
        renderContent();
      }
    }
  </script>
</body>
</html>
